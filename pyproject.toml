[project]
name = "imprintai-provenance"
version = "1.2.0"
description = "Opt-in blockchain provenance and C2PA export nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "requests>=2.31.0",
  "Pillow>=12.3.0",
  "cryptography>=42.0.0",
]

[project.urls]
Repository = "https://github.com/svcBSV/imprintai-comfyui"
Documentation = "https://github.com/svcBSV/imprintai-comfyui#readme"
"Bug Tracker" = "https://github.com/svcBSV/imprintai-comfyui/issues"

[tool.comfy]
# Immutable publisher identity configured at registry.comfy.org.
PublisherId = "imprintai"
DisplayName = "ImprintAI Provenance"