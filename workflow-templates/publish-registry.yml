name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require configured publisher
        run: |
          if grep -q 'PublisherId = "PUBLISHER_ID_REQUIRED"' pyproject.toml; then
            echo "Create the immutable Registry publisher and update PublisherId first."
            exit 1
          fi
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}