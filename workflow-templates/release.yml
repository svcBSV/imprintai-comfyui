name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_distribution.py
      - name: Check tag matches package version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build archive and checksum
        run: |
          mkdir -p dist/imprintai-comfyui
          cp __init__.py imprint_nodes.py pyproject.toml requirements.txt README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md release.json CHECKSUMS.sha256 dist/imprintai-comfyui/
          cp -R scripts workflow-templates dist/imprintai-comfyui/
          cd dist
          zip -r "imprintai-comfyui-${GITHUB_REF_NAME}.zip" imprintai-comfyui
          sha256sum "imprintai-comfyui-${GITHUB_REF_NAME}.zip" > "imprintai-comfyui-${GITHUB_REF_NAME}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256