name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/validate_distribution.py
      - name: Reject likely committed secrets
        run: |
          if git grep -nEI '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]|xox[baprs]-[A-Za-z0-9-]+)' -- . ':!*.md'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi